[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "leakguard"
version = "0.1.0"
description = "Deterministic scientific ML dataset leakage auditor: exact duplicates, group-ID contamination, temporal look-ahead/embargo violations, Haversine spatial proximity leakage, and target-proxy detection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "machine-learning",
    "data-leakage",
    "reproducibility",
    "scientific-computing",
    "time-series",
    "geospatial",
    "tabular-ml",
    "mlops",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
leakguard = "leakguard.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/leakguard"
Repository = "https://github.com/codesphere-u/leakguard"
Issues = "https://github.com/codesphere-u/leakguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/leakguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["leakguard"]
